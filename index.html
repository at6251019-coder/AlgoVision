<!DOCTYPE html>
<html>
<head>
<title>AlgoVision Animated</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(-45deg, #000000, #0f0c29, #302b63, #24243e);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
  color: white;
  font-family: Arial;
  text-align: center;
}

@keyframes bg {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

h1 {
  margin-top: 20%;
  font-size: 50px;
}
</style>

</head>

<body>
<h1>AlgoVision Animated Dashboard</h1>
</body>
</html>
